name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # ── 每次 push / PR 都跑，检查代码质量和测试 ──
  test:
    name: Test & Lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install frontend dependencies
        run: npm ci --audit=false
        working-directory: frontend

      - name: npm audit (high/critical)
        run: npm audit --audit-level=high
        working-directory: frontend

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 ./...

  # ── 仅在打 tag (v*) 时跑完整构建 ──
  build:
    name: Build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build ClipBox
        run: wails build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipbox-windows-amd64
          path: build/bin/clipbox.exe

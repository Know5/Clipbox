name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Go
        shell: powershell
        run: |
          $ver = "1.25.3"
          $url = "https://go.dev/dl/go$ver.windows-amd64.zip"
          Write-Host "Downloading Go $ver from go.dev"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\go.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\go.zip" -DestinationPath "$env:RUNNER_TEMP"
          echo "$env:RUNNER_TEMP\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 ./...

  build:
    name: Build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Go
        shell: powershell
        run: |
          $ver = "1.25.3"
          $url = "https://go.dev/dl/go$ver.windows-amd64.zip"
          Write-Host "Downloading Go $ver from go.dev"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\go.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\go.zip" -DestinationPath "$env:RUNNER_TEMP"
          echo "$env:RUNNER_TEMP\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build ClipBox
        run: wails build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipbox-windows-amd64
          path: build/bin/clipbox.exe
